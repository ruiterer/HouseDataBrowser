# Platform-manifest (bron). Installeren = kopiëren naar
# ~/.config/platform-hub/manifests/housedata.toml.

[tool]
name = "housedata"
project = "HouseDataBrowser"
title = "HouseData Browser"
goal = "Huis-sensordata bevragen in natuurlijke taal"
port = 8603
panel_path = "/"
health_path = "/"
blocks = []
kit_version = "none"
level = "minimal"
# Prefix-bewuste SPA sinds de D-025-moderniseringssessie; de Docker-poort
# bindt op 127.0.0.1 en de hub-proxy is de enige route van buitenaf.
lan = true
proxy = true

# Procesbeheer (D-031 in Portfolio_Manager): Docker-container — start en stop
# zijn losse commando's; de healthcheck van de hub bevestigt het resultaat.
start_cmd = ["/usr/local/bin/docker", "start", "housedatabrowser"]
stop_cmd = ["/usr/local/bin/docker", "stop", "housedatabrowser"]

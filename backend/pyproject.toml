[project]
name = "housedatabrowser-backend"
version = "0.1.0"
description = "Natural-language web app over a home InfluxDB 1.x"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "influxdb>=5.3",
    "pandas>=2.2",
    "numpy>=2.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "sqlparse>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
